apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletest-deployment
  labels:
    app: scaletest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletest
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: scaletest
    spec:
      containers:
      - name: scaletest
        image: ghcr.io/yandex-practicum/scaletestapp
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "30Mi"
          requests:
            memory: "30Mi"
      restartPolicy: Always